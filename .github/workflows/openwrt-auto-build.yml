# =============================================================================
# OpenWrt Auto Build — 全量 SDK 编译版
# 检测上游更新 → 全量源码编译（含 Nikki feeds）→ QEMU 烟雾测试 → 发布 Release
# =============================================================================
name: openwrt-auto-build

on:
  schedule:
    - cron: '0 6 * * *'    # 每天 UTC 06:00 / 北京时间 14:00 检测
  # PR 里先跑验证：静态检查必跑；全量编译需给 PR 打 ci:full-build 标签
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'files/**'
      - 'feeds.conf'
  workflow_dispatch:
    inputs:
      force_build:
        description: '强制构建（跳过版本比较）'
        type: boolean
        default: false
      nikki_ref:
        description: 'Nikki ref（tag/branch/sha，空=用 latest tag）'
        type: string
        default: ''
      runner_image:
        description: 'Runner 镜像（空=仓库变量 RUNNER_IMAGE，再空=ubuntu-26.04）'
        type: string
        default: ''

permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  OWRT_REPO: openwrt/openwrt
  NIKKI_REPO: nikkinikki-org/OpenWrt-nikki
  LAST_VERSION_FILE: last_build_version
  BUILD_DIR: openwrt
  CCACHE_DIR: /tmp/.ccache
  MAKE_JOBS: 4                        # GitHub Actions 免费 runner 2 核 4 线程

jobs:
  # ─── Job 0: 静态检查（PR 必跑，几分钟出结果） ─────────────────────────
  lint:
    runs-on: ${{ inputs.runner_image || vars.RUNNER_IMAGE || 'ubuntu-26.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: 🧹 Shell 语法检查
        run: |
          set -e
          shopt -s nullglob
          for f in scripts/*.sh; do bash -n "$f"; echo "✅ $f"; done
      - name: 🐍 Python 语法检查
        run: |
          set -e
          for f in scripts/*.py; do python3 -m py_compile "$f"; echo "✅ $f"; done
      - name: 📄 Workflow YAML 校验
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-yaml
          python3 -c "import glob,yaml; [print('✅', p) or yaml.safe_load(open(p, encoding='utf-8')) for p in sorted(glob.glob('.github/workflows/*.yml'))]"
      - name: 🔗 feeds 分隔符契约（40 位 sha 用 ^，tag 用 ;）
        run: |
          set -e
          bash scripts/gen-feeds-conf.sh v25.12.6 31339d53b454f575082dc4e16510c96858e01921 | tee /tmp/f1
          grep -q 'OpenWrt-nikki.git\^31339d53b454f575082dc4e16510c96858e01921' /tmp/f1 || { echo "❌ 40 位 sha 未用 ^"; exit 1; }
          bash scripts/gen-feeds-conf.sh v25.12.6 v1.26.2 | tee /tmp/f2
          grep -q 'OpenWrt-nikki.git;v1.26.2' /tmp/f2 || { echo "❌ tag 未用 ;"; exit 1; }
          echo "✅ feeds 分隔符契约成立"

  # ─── Job 1: 检测上游 ─────────────────────────────────────────────────────
  check-upstream:
    runs-on: ${{ inputs.runner_image || vars.RUNNER_IMAGE || 'ubuntu-26.04' }}
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      artifact_name: ${{ steps.check.outputs.artifact_name }}
      owrt_version: ${{ steps.check.outputs.owrt_version }}
      owrt_ver_safe: ${{ steps.check.outputs.owrt_ver_safe }}
      kernel_version: ${{ steps.check.outputs.kernel_version }}
      nikki_tag: ${{ steps.check.outputs.nikki_tag }}
      nikki_ref: ${{ steps.check.outputs.nikki_ref }}
      nikki_sha: ${{ steps.check.outputs.nikki_sha }}
      nikki_short_sha: ${{ steps.check.outputs.nikki_short_sha }}
    steps:
      - uses: actions/checkout@v7

      - name: 🔍 检测上游版本
        id: check
        run: |
          SAVED=$(cat ${{ env.LAST_VERSION_FILE }} 2>/dev/null || echo "none")
          EVENT_NAME="${{ github.event_name }}"

          # ── OpenWrt latest tag ──
          OWRT_TAG=$(curl -sL "https://api.github.com/repos/${{ env.OWRT_REPO }}/releases/latest" \
            | jq -r '.tag_name // empty')
          echo "owrt_version=$OWRT_TAG" >> "$GITHUB_OUTPUT"

          OWRT_SAFE="${OWRT_TAG#v}"
          echo "owrt_ver_safe=$OWRT_SAFE" >> "$GITHUB_OUTPUT"

          # Artifact 名：PR 构建加 -pr<编号>，避免和正式件同名，下载区一眼能分
          ARTIFACT_NAME="oasisic-openwrt-${OWRT_SAFE}"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            ARTIFACT_NAME="${ARTIFACT_NAME}-pr${{ github.event.pull_request.number }}"
          elif [ "${GITHUB_REF_NAME:-main}" != "main" ]; then
            # 在分支上手动 dispatch 时也要区分，否则会和正式件同名
            BRANCH_SAFE=$(printf '%s' "${GITHUB_REF_NAME:-unknown}" | tr '/_' '--' | tr -cd 'A-Za-z0-9.-')
            ARTIFACT_NAME="${ARTIFACT_NAME}-branch-${BRANCH_SAFE}"
          fi
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "📦 Artifact 名: $ARTIFACT_NAME"

          # ── 内核版本（仅展示，不作为 should_build 信号） ──
          KERNEL_VER=$(curl -sL "https://www.kernel.org/releases.json" \
            | jq -r '[.releases[] | select(.moniker == "stable" or .moniker == "longterm") | .version][0] // empty')
          echo "kernel_version=$KERNEL_VER" >> "$GITHUB_OUTPUT"

          # ── Nikki ref 解析 ──
          # 优先 workflow_dispatch 输入，否则用 latest release tag
          INPUT_NIKKI_REF="${{ inputs.nikki_ref }}"
          if [ -n "$INPUT_NIKKI_REF" ]; then
            NIKKI_REF="$INPUT_NIKKI_REF"
          else
            NIKKI_REF=$(curl -sL "https://api.github.com/repos/${{ env.NIKKI_REPO }}/releases/latest" \
              | jq -r '.tag_name // empty')
          fi
          echo "nikki_ref=$NIKKI_REF" >> "$GITHUB_OUTPUT"

          # 保留 tag 名用于显示
          NIKKI_TAG=$(curl -sL "https://api.github.com/repos/${{ env.NIKKI_REPO }}/releases/latest" \
            | jq -r '.tag_name // empty')
          echo "nikki_tag=$NIKKI_TAG" >> "$GITHUB_OUTPUT"

          # ── 解析 NIKKI_REF 到实际 SHA ──
          # 优先 GitHub API（/commits/ 始终返回 commit sha，支持 tag/branch/sha）
          # 回退 git ls-remote（含 ^{} 解除附注 tag 引用）
          NIKKI_SHA=$(curl -sL "https://api.github.com/repos/${{ env.NIKKI_REPO }}/commits/$NIKKI_REF" \
            | jq -r '.sha // empty')
          if [ -z "$NIKKI_SHA" ]; then
            NIKKI_SHA=$(git ls-remote "https://github.com/${{ env.NIKKI_REPO }}.git" \
              "$NIKKI_REF^{}" "$NIKKI_REF" 2>/dev/null | head -1 | awk '{print $1}')
          fi
          if [ -z "$NIKKI_SHA" ]; then
            echo "❌ 无法解析 Nikki ref: $NIKKI_REF" >&2
            exit 1
          fi
          NIKKI_SHORT_SHA="${NIKKI_SHA:0:7}"
          echo "nikki_sha=$NIKKI_SHA" >> "$GITHUB_OUTPUT"
          echo "nikki_short_sha=$NIKKI_SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "✅ Nikki ref: $NIKKI_REF → SHA: $NIKKI_SHORT_SHA ($NIKKI_SHA)"

          # ── Composite key: 不含 kernel.org ──
          COMPOSITE="${OWRT_TAG}_nikki-${NIKKI_SHA}"

          # ── should_build 判定 ──
          FORCE_BUILD="${{ inputs.force_build }}"
          # PR 验证构建：忽略 last_build_version 去重，保证每次 PR 都真编
          if [ "$FORCE_BUILD" = "true" ] || [ "$EVENT_NAME" = "pull_request" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "✅ 强制构建（force_build=true）"
          elif [ -z "$OWRT_TAG" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "⏭️  OpenWrt 版本为空，跳过构建"
          elif [ "$COMPOSITE" != "$SAVED" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "✅ 检测到更新: $COMPOSITE (上次: $SAVED)"
          elif [ ! -f "${{ env.LAST_VERSION_FILE }}" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "✅ last_build_version 文件缺失，重新构建"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "⏭️  无更新,跳过构建"
          fi

  # ─── Job 2: 全量 SDK 编译 ──────────────────────────────────────────────
  build:
    needs: check-upstream
    # PR 只跑静态检查，打上 ci:full-build 标签才跑全量编译（约 90 分钟）
    if: |
      needs.check-upstream.outputs.should_build == 'true' && (
        github.event_name != 'pull_request' ||
        contains(github.event.pull_request.labels.*.name, 'ci:full-build')
      )
    runs-on: ${{ inputs.runner_image || vars.RUNNER_IMAGE || 'ubuntu-26.04' }}
    outputs:
      kernel_version: ${{ steps.kernel-version.outputs.kernel_version }}
      nikki_version_actual: ${{ steps.nikki-version.outputs.nikki_version_actual }}
      root_password: ${{ steps.gen-pass.outputs.root_password }}
      owrt_version: ${{ needs.check-upstream.outputs.owrt_version }}
      owrt_ver_safe: ${{ needs.check-upstream.outputs.owrt_ver_safe }}
      nikki_tag: ${{ needs.check-upstream.outputs.nikki_tag }}
      nikki_ref: ${{ needs.check-upstream.outputs.nikki_ref }}
      nikki_sha: ${{ needs.check-upstream.outputs.nikki_sha }}
      nikki_short_sha: ${{ needs.check-upstream.outputs.nikki_short_sha }}
    steps:
      - uses: actions/checkout@v7

      - name: 💾 释放 runner 磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" /usr/local/lib/android || true
          df -h

      - name: 💾 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential libncurses-dev \
            zlib1g-dev gawk git gettext wget unzip python3 \
            file qemu-utils ccache genisoimage

      - name: 💾 恢复 ccache 缓存
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          # 镜像必须进 key：ccache 产物与宿主编译器版本强相关
          key: ccache-openwrt-${{ needs.check-upstream.outputs.owrt_ver_safe }}-${{ inputs.runner_image || vars.RUNNER_IMAGE || 'ubuntu-26.04' }}-${{ hashFiles('scripts/gen-config.sh') }}
          restore-keys: |
            ccache-openwrt-${{ needs.check-upstream.outputs.owrt_ver_safe }}-${{ inputs.runner_image || vars.RUNNER_IMAGE || 'ubuntu-26.04' }}-

      - name: 💾 恢复源码树缓存
        id: source-cache
        uses: actions/cache@v5
        with:
          path: ${{ env.BUILD_DIR }}
          # 镜像必须进 key，且不做前缀回退：源码树里含 staging_dir/host 等构建态，
          # 跨镜像/跨 config 的部分恢复会让 make 误判"工具已编好"（#210 即因此失败）
          key: source-openwrt-${{ needs.check-upstream.outputs.owrt_ver_safe }}-${{ inputs.runner_image || vars.RUNNER_IMAGE || 'ubuntu-26.04' }}-${{ hashFiles('scripts/gen-config.sh') }}
          restore-keys: |
            source-openwrt-${{ needs.check-upstream.outputs.owrt_ver_safe }}-${{ inputs.runner_image || vars.RUNNER_IMAGE || 'ubuntu-26.04' }}-

      - name: 💾 恢复 dl 缓存
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.BUILD_DIR }}/dl
            ${{ env.BUILD_DIR }}/feeds
          # dl 只是源码包 tarball，跨镜像复用安全，故不带镜像维度
          key: dl-openwrt-${{ needs.check-upstream.outputs.owrt_ver_safe }}-${{ needs.check-upstream.outputs.nikki_sha }}-${{ hashFiles('scripts/gen-config.sh') }}
          restore-keys: |
            dl-openwrt-${{ needs.check-upstream.outputs.owrt_ver_safe }}-
            dl-openwrt-

      - name: 🧪 源码树缓存一致性自检
        run: |
          set +e
          HOSTBIN="${{ env.BUILD_DIR }}/staging_dir/host/bin"
          if [ -d "${{ env.BUILD_DIR }}/staging_dir" ]; then
            if "$HOSTBIN/python3" --version >/dev/null 2>&1; then
              echo "✅ 继承的 host 工具链可用：$("$HOSTBIN/python3" --version 2>&1)"
            else
              echo "⚠️ 继承的 host 工具链不可用（多为跨镜像/跨 config 缓存污染），清理后重建"
              rm -rf "${{ env.BUILD_DIR }}/staging_dir/host" "${{ env.BUILD_DIR }}/build_dir/host"
              rm -rf "${{ env.BUILD_DIR }}/tmp/stamp"
            fi
          else
            echo "ℹ️ 无源码树缓存，属冷构建"
          fi
          set -e

      - name: ⬇️ 克隆 OpenWrt 源码（自动重试）
        if: steps.source-cache.outputs.cache-hit != 'true'
        run: |
          TAG="${{ needs.check-upstream.outputs.owrt_version }}"
          n=0
          until [ $n -ge 3 ]; do
            rm -rf "${{ env.BUILD_DIR }}"
            git clone --depth 1 --branch "$TAG" \
              https://github.com/${{ env.OWRT_REPO }}.git \
              "${{ env.BUILD_DIR }}" && break
            n=$((n+1))
            echo "⏳ 克隆源码第 $n 次重试..."
            sleep 30
          done
          if [ $n -ge 3 ]; then
            echo "❌ 克隆源码失败（3 次重试）"
            exit 1
          fi

      - name: 🔑 生成随机 root 密码
        id: gen-pass
        run: |
          mkdir -p files/etc
          # 清理 shadow 中可能存在的注释行（busybox 解析器不识别 # 注释）
          sed -i '/^#/d' files/etc/shadow
          PASSWORD=$(openssl rand -base64 12 | tr -d '=' | tr '/+' 'x9' | head -c 16)
          HASH=$(openssl passwd -6 "$PASSWORD")
          sed -i "s|^root:[^:]*:|root:${HASH}:|" files/etc/shadow

          if grep -q "^root:" files/etc/shadow; then
            echo "✅ 密码已写入 shadow"
          else
            echo "❌ 密码写入 shadow 失败" >&2
            exit 1
          fi
          echo "root_password=${PASSWORD}" >> "$GITHUB_OUTPUT"
          echo "✅ 已生成随机 root 密码"

      - name: ⚙️ 复制自定义文件
        run: |
          mkdir -p "${{ env.BUILD_DIR }}/files"
          cp -r files/* "${{ env.BUILD_DIR }}/files/"
          # 替换版本号占位符
          OWRT_VER="${{ needs.check-upstream.outputs.owrt_version }}"
          sed -i "s/@OWRT_VERSION@/${OWRT_VER}/g" "${{ env.BUILD_DIR }}/files/www/setup.html"

      - name: ⚙️ 配置 feeds（版本跟踪，自动重试）
        run: |
          bash scripts/gen-feeds-conf.sh \
            "${{ needs.check-upstream.outputs.owrt_version }}" \
            "${{ needs.check-upstream.outputs.nikki_sha }}" \
            > "${{ env.BUILD_DIR }}/feeds.conf.default"
          cd "${{ env.BUILD_DIR }}"
          rm -rf feeds 2>/dev/null || true
          n=0
          until [ $n -ge 3 ]; do
            ./scripts/feeds update -a && break
            n=$((n+1))
            echo "⏳ feeds update 第 $n 次重试..."
            sleep 30
          done
          if [ $n -ge 3 ]; then
            echo "❌ feeds update 失败"
            exit 1
          fi
          ./scripts/feeds install -a

      - name: ⚙️ 生成 .config
        run: |
          bash scripts/gen-config.sh "${{ env.BUILD_DIR }}"
          cd "${{ env.BUILD_DIR }}"
          make defconfig
          echo "✅ defconfig 完成"

      - name: ⬇️ 下载源码包（自动重试）
        run: |
          cd "${{ env.BUILD_DIR }}"
          n=0
          until [ $n -ge 3 ]; do
            make download -j${{ env.MAKE_JOBS }} && break
            n=$((n+1))
            echo "⏳ make download 第 $n 次重试..."
            sleep 30
          done
          if [ $n -ge 3 ]; then
            echo "❌ make download 失败"
            exit 1
          fi

      - name: 🏗️ 编译固件
        run: |
          cd "${{ env.BUILD_DIR }}"
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          export PATH="/usr/lib/ccache:$PATH"
          make -j${{ env.MAKE_JOBS }} || { echo "⚠️ 编译失败，开启 verbose 重试…"; make -j1 V=s; }

      - name: 📊 ccache 统计
        run: |
          echo "## 📊 ccache 统计" >> "$GITHUB_STEP_SUMMARY"
          echo '<table>' >> "$GITHUB_STEP_SUMMARY"
          echo '<tr><th>指标</th><th>数值</th><th>Metric</th></tr>' >> "$GITHUB_STEP_SUMMARY"
          ccache -s | while IFS= read -r line; do
            label=$(echo "$line" | sed 's/^[[:space:]]*//;s/[[:space:]].*//')
            val=$(echo "$line" | sed 's/^[[:space:]]*[^[:space:]]*[[:space:]]*//')
            case "$label" in
              "cacheable") EN="Cacheable calls"; ZH="可缓存调用次数" ;;
              "cacheable_calls") EN="Cacheable calls"; ZH="可缓存调用次数" ;;
              "uncacheable") EN="Uncacheable calls"; ZH="不可缓存调用次数" ;;
              "uncacheable_calls") EN="Uncacheable calls"; ZH="不可缓存调用次数" ;;
              "hits") EN="Cache hits"; ZH="缓存命中数" ;;
              "direct") EN="Direct hits"; ZH="直接命中" ;;
              "direct_hits") EN="Direct hits"; ZH="直接命中" ;;
              "preprocessed") EN="Preprocessed hits"; ZH="预处理命中" ;;
              "preprocessed_hits") EN="Preprocessed hits"; ZH="预处理命中" ;;
              "misses") EN="Cache misses"; ZH="缓存未命中" ;;
              "called") EN="Total calls"; ZH="总调用次数" ;;
              "called_for") EN="Hits"; ZH="命中" ;;
              "compile") EN="Misses"; ZH="未命中" ;;
              "local") EN="Local storage"; ZH="本地存储" ;;
              "local_storage") EN="Local storage"; ZH="本地存储" ;;
              "cache") EN="Cache size"; ZH="缓存大小" ;;
              "cache_size") EN="Cache size"; ZH="缓存大小" ;;
              "cache_hit") EN="Cache hit rate"; ZH="缓存命中率" ;;
              "max_cache") EN="Max cache size"; ZH="最大缓存大小" ;;
              "max_size") EN="Max cache size"; ZH="最大缓存大小" ;;
              "cleanups") EN="Cache cleanups"; ZH="缓存清理次数" ;;
              *) EN="$label"; ZH="$label" ;;
            esac
            echo "<tr><td>$ZH</td><td>$val</td><td>$EN</td></tr>" >> "$GITHUB_STEP_SUMMARY"
          done
          echo '</table>' >> "$GITHUB_STEP_SUMMARY"
          echo "✅ ccache 统计已写入 job summary"

      - name: 🐧 提取内核版本
        id: kernel-version
        run: |
          PATCHVER=$(grep -oP '^KERNEL_PATCHVER:=\s*\K.*' "${{ env.BUILD_DIR }}/target/linux/x86/Makefile" 2>/dev/null | head -1 || echo "")
          if [ -n "$PATCHVER" ]; then
            SUFFIX=$(grep -oP "^LINUX_VERSION-${PATCHVER}\s*=\s*\K.*" "${{ env.BUILD_DIR }}/target/linux/generic/kernel-${PATCHVER}" 2>/dev/null || echo "")
            KV="${PATCHVER}${SUFFIX}"
          else
            KV=$(grep -oP 'CONFIG_LINUX_VERSION_STRING\s*=\s*"\K[^"]*' "${{ env.BUILD_DIR }}/.config" 2>/dev/null || echo "")
          fi
          echo "kernel_version=${KV:-?}" >> "$GITHUB_OUTPUT"
          echo "✅ 内核版本: ${KV:-?}"

      - name: 📡 提取 Nikki 版本
        id: nikki-version
        run: |
          VER=""
          for dir in "${{ env.BUILD_DIR }}/bin/packages/x86_64"/*; do
            APK=$(find "$dir" -name "luci-app-nikki*.apk" 2>/dev/null | head -1)
            IPK=$(find "$dir" -name "luci-app-nikki_*.ipk" 2>/dev/null | head -1)
            if [ -n "$APK" ]; then
              VER=$(basename "$APK" | sed 's/luci-app-nikki-//;s/-r[0-9]*\.apk$//')
              break
            elif [ -n "$IPK" ]; then
              VER=$(basename "$IPK" | sed 's/luci-app-nikki_//;s/_.*//')
              break
            fi
          done
          # 若提取不到，回退到 nikki_ref
          FALLBACK="${{ needs.check-upstream.outputs.nikki_ref }}"
          echo "nikki_version_actual=${VER:-$FALLBACK}" >> "$GITHUB_OUTPUT"
          echo "✅ Nikki 版本: ${VER:-$FALLBACK}"

      - name: 🧹 清理中间产物
        run: |
          du -sh "${{ env.BUILD_DIR }}"
          rm -rf "${{ env.BUILD_DIR }}/build_dir" || true
          rm -rf "${{ env.BUILD_DIR }}/staging_dir/target-*" || true
          du -sh "${{ env.BUILD_DIR }}"
          echo "✅ 清理完成"

      - name: 🔏 固件签名（minisign）
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_KEY_ID: ${{ secrets.MINISIGN_KEY_ID }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          pip install pynacl -q
          bash scripts/minisign-sign.sh "${{ env.BUILD_DIR }}/bin/targets/x86/64/sha256sums"

      - name: 📋 展示编译产物
        run: |
          bash scripts/check-firmware.sh "${{ env.BUILD_DIR }}"
          echo ""
          echo "=== 固件镜像 ==="
          ls -lh "${{ env.BUILD_DIR }}/bin/targets/x86/64/"*.img.gz 2>/dev/null || echo "(无)"
          echo ""
          echo "=== feeds.conf.default ==="
          cat "${{ env.BUILD_DIR }}/feeds.conf.default" 2>/dev/null || echo "(无)"

      - name: 📝 文档一致性检查
        run: |
          bash scripts/check-docs-consistency.sh

      - name: 💾 保存版本标识
        run: |
          echo "${{ needs.check-upstream.outputs.owrt_version }}_nikki-${{ needs.check-upstream.outputs.nikki_sha }}" \
            > "${{ env.LAST_VERSION_FILE }}"

      - name: 📝 产物下载入口写入 Summary
        run: |
          echo "### 📥 固件下载" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run 页面 Artifacts：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact 名：\`${{ needs.check-upstream.outputs.artifact_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 命令行：\`gh run download ${{ github.run_id }} -n ${{ needs.check-upstream.outputs.artifact_name }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 上传固件 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.check-upstream.outputs.artifact_name }}
          path: |
            ${{ env.BUILD_DIR }}/bin/targets/x86/64/openwrt-x86-64-generic-squashfs-combined-efi.img.gz
            ${{ env.BUILD_DIR }}/bin/targets/x86/64/openwrt-x86-64-generic-squashfs-combined.img.gz
            ${{ env.BUILD_DIR }}/bin/targets/x86/64/openwrt-x86-64-generic-image.iso
            ${{ env.BUILD_DIR }}/bin/targets/x86/64/openwrt-x86-64-generic-image-efi.iso
            ${{ env.BUILD_DIR }}/bin/targets/x86/64/sha256sums
            ${{ env.BUILD_DIR }}/bin/targets/x86/64/sha256sums.minisig
            ${{ env.BUILD_DIR }}/feeds.conf.default
            ${{ env.BUILD_DIR }}/bin/targets/x86/64/config.buildinfo
            ${{ env.BUILD_DIR }}/bin/targets/x86/64/profiles.json
            ${{ env.BUILD_DIR }}/bin/targets/x86/64/openwrt-x86-64-generic.manifest
          retention-days: 30

  # ─── Job 3: QEMU 烟雾测试（阻断门）─────────────────────────────────────
  qemu-smoke-test:
    needs: [check-upstream, build]
    if: needs.check-upstream.outputs.should_build == 'true'
    runs-on: ${{ inputs.runner_image || vars.RUNNER_IMAGE || 'ubuntu-26.04' }}
    steps:
      - name: 📥 下载固件 Artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.check-upstream.outputs.artifact_name }}
          path: firmware/

      - name: 🚀 QEMU 烟雾测试
        run: |
          set -euo pipefail

          FIRMWARE_GZ="$(find "firmware/bin/targets/x86/64/" -name '*-squashfs-combined-efi.img.gz' -type f 2>/dev/null | head -1)"
          if [ -z "$FIRMWARE_GZ" ]; then
            FIRMWARE_GZ="$(find "firmware/bin/targets/x86/64/" -name '*-squashfs-combined.img.gz' -type f 2>/dev/null | head -1)"
          fi
          if [ -z "$FIRMWARE_GZ" ]; then
            echo "⚠️ 未找到固件镜像，跳过 QEMU 测试"
            exit 0
          fi

          gunzip -k -f "$FIRMWARE_GZ"
          IMG="${FIRMWARE_GZ%.gz}"
          echo "📦 固件: $(basename "$IMG") ($(du -h "$IMG" | cut -f1))"

          # 26.04 起包名由 qemu-system-x86-64 改为 qemu-system-x86；按序回退，装不上就硬失败（禁止静默跳过）
          for pkg in qemu-system-x86 qemu-system-x86-64 qemu-system; do
            if sudo apt-get install -y -qq "$pkg" ovmf 2>/dev/null; then echo "✅ qemu 包: $pkg"; break; fi
          done
          command -v qemu-system-x86_64 >/dev/null || { echo "❌ 未安装 qemu-system-x86_64，烟雾测试无法进行"; exit 1; }

          # OVMF 固件：找不到就硬失败。假绿（跳过后仍显示绿色）比失败更危险
          OVMF_CODE=""
          for f in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd \
                   /usr/share/ovmf/OVMF_CODE_4M.fd /usr/share/ovmf/OVMF_CODE.fd \
                   /usr/share/qemu/OVMF_CODE_4M.fd /usr/share/qemu/OVMF_CODE.fd; do
            [ -f "$f" ] && OVMF_CODE="$f" && break
          done
          if [ -z "$OVMF_CODE" ]; then
            OVMF_CODE="$(sudo find /usr/share -maxdepth 4 -name 'OVMF_CODE*.fd' -type f 2>/dev/null | head -1)"
          fi
          if [ -z "$OVMF_CODE" ]; then
            echo "❌ 未找到 OVMF 固件：已尝试 /usr/share/{OVMF,ovmf,qemu} 及全盘搜索"
            echo "   请确认 ovmf 包是否装成功；qemu 烟雾测试不能静默跳过"
            exit 1
          fi
          echo "✅ OVMF: $OVMF_CODE"

          BOOT_LOG="/tmp/boot.log"
          OVMF_VARS="/tmp/ovmf_vars.fd"
          cp "$(dirname "$OVMF_CODE")/OVMF_VARS_4M.fd" "$OVMF_VARS" 2>/dev/null || \
            cp "$(dirname "$OVMF_CODE")/OVMF_VARS.fd" "$OVMF_VARS" 2>/dev/null || \
            cp "$(find /usr/share -maxdepth 4 -name 'OVMF_VARS*.fd' -type f 2>/dev/null | head -1)" "$OVMF_VARS" 2>/dev/null || \
            touch "$OVMF_VARS"

          timeout 300 qemu-system-x86_64 \
            -m 256 -machine q35 -nographic \
            -serial "file:${BOOT_LOG}" \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -drive if=pflash,format=raw,file="$OVMF_VARS" \
            -drive file="$IMG",format=raw,if=virtio \
            -netdev user,id=net0,hostfwd=tcp::8080-:80 \
            -device virtio-net-pci,netdev=net0 \
            -no-reboot >/dev/null 2>&1 &
          QEMU_PID=$!

          START_TS=$(date +%s)
          LUCI_OK=false
          TIMEOUT=300
          while [ $(( $(date +%s) - $START_TS )) -lt $TIMEOUT ]; do
            if grep -qiE '(kernel panic|Oops|BUG:|unable to handle kernel)' "$BOOT_LOG" 2>/dev/null; then
              echo "❌ 内核异常！"
              grep -iE '(kernel panic|Oops|BUG:|unable to handle kernel)' "$BOOT_LOG" | tail -5
              kill $QEMU_PID 2>/dev/null || true
              exit 1
            fi
            if curl -sf -o /dev/null http://127.0.0.1:8080/ 2>/dev/null; then
              echo "✅ LuCI 首页响应 200"
              LUCI_OK=true
              break
            fi
            sleep 5
          done

          if [ "$LUCI_OK" != "true" ]; then
            echo "❌ 超时: LuCI 未在 ${TIMEOUT}s 内响应"
            tail -50 "$BOOT_LOG" 2>/dev/null || true
            kill $QEMU_PID 2>/dev/null || true
            exit 1
          fi

          # ─── LuCI JS 资源完整性检查 ──────────────────────────
          echo "🔍 检查 LuCI JS 资源..."
          JS_CHECK_FAIL=false
          for js_url in \
            "http://127.0.0.1:8080/luci-static/resources/luci.js" \
            "http://127.0.0.1:8080/luci-static/resources/ui.js" \
            "http://127.0.0.1:8080/luci-static/resources/cbi.js"; do
            JS_NAME=$(basename "$js_url")
            JS_CONTENT=$(curl -sL "$js_url" 2>/dev/null || true)
            JS_SIZE=${#JS_CONTENT}

            if [ "$JS_SIZE" -lt 100 ]; then
              echo "❌ ${JS_NAME}: 内容过短 (${JS_SIZE} bytes)，可能缺失或 404"
              JS_CHECK_FAIL=true
              continue
            fi

            # 检查是否被当作 gzip 二进制流输出（前 2 字节为 0x1f 0x8b）
            FIRST_BYTES=$(od -A n -t x1 <<< "${JS_CONTENT:0:20}" | tr -d ' ')
            if echo "$FIRST_BYTES" | grep -q '^1f8b'; then
              echo "❌ ${JS_NAME}: 以 gzip 压缩二进制输出（uhttpd 未解压 .js.gz）"
              JS_CHECK_FAIL=true
              continue
            fi

            echo "✅ ${JS_NAME}: ${JS_SIZE} bytes, 非 gzip 二进制"
          done

          if [ "$JS_CHECK_FAIL" = "true" ]; then
            echo "❌ JS 资源检查失败，终止"
            kill $QEMU_PID 2>/dev/null || true
            exit 1
          fi
          echo "✅ LuCI JS 资源完整性检查通过"

          echo "🎉 QEMU 烟雾测试通过"
          kill $QEMU_PID 2>/dev/null || true
          rm -f "$IMG" "$BOOT_LOG" "$OVMF_VARS"

  # ─── Job 4: 发布 Release + 通知 ──────────────────────────────────────
  release:
    needs: [check-upstream, build, qemu-smoke-test]
    if: needs.check-upstream.outputs.should_build == 'true' && github.event_name != 'pull_request'
    runs-on: ${{ inputs.runner_image || vars.RUNNER_IMAGE || 'ubuntu-26.04' }}
    steps:
      - uses: actions/checkout@v7
      - name: 📥 下载固件 Artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.check-upstream.outputs.artifact_name }}
          path: release-artifacts/

      - name: 🏷️ 生成 Release body
        run: |
          NV="${{ needs.build.outputs.nikki_version_actual }}"
          KV="${{ needs.build.outputs.kernel_version }}"
          PW="${{ needs.build.outputs.root_password }}"
          NIKKI_REF="${{ needs.build.outputs.nikki_ref }}"
          NIKKI_SHA="${{ needs.build.outputs.nikki_sha }}"
          NIKKI_SHORT="${NIKKI_SHA:0:7}"
          cat > release-body.md << RELEASEEOF
          ## 🏝️ Oasisic OpenWrt 自动构建

          | 项 | 值 |
          |----|-----|
          | OpenWrt 版本 | ${{ needs.check-upstream.outputs.owrt_version }} |
          | Nikki 版本 | ${NV} |
          | Nikki 提交 | ${NIKKI_SHORT}（ref: ${NIKKI_REF}） |
          RELEASEEOF
          if [ -n "$KV" ] && [ "$KV" != "?" ]; then
            echo "| Linux 内核 | ${KV} |" >> release-body.md
          fi
          cat >> release-body.md << RELEASEEOF
          | 架构 | x86/64, EFI, squashfs |
          | 编译时间 | $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S') 北京时间 |

          ### 🔑 登录信息
          - **主机名**: Oasisic-OpenWrt
          - **用户名**: root
          - **密码**: \`${PW}\`
          - **密码有效期**: 仅首次开机有效；首次配置向导完成后**请立即修改**
          - **首次开机**: DHCP 自动获取 IP（到主路由查看）

          ### 📦 预装组件
          - **代理**: Nikki + mihomo-meta ${NV}
          - **主题**: luci-theme-bootstrap
          - **PVE**: qemu-ga + virtio 全系驱动
          - **DNS**: dnsmasq-full (dhcp/dnssec/nftset/dhcpv6)
          - **工具**: bash, curl, wget, yq, htop, tcpdump, vim

          ### 📥 下载
          - \`squashfs-combined-efi.img.gz\` — EFI 启动 (推荐 PVE UEFI)
          - \`squashfs-combined.img.gz\` — BIOS 启动
          - \`image.iso\` — ISO 镜像
          - \`feeds.conf.default\` — 编译源列表
          - \`sha256sums\` — 固件校验和
          - \`sha256sums.minisig\` — minisign 签名
          - \`config.buildinfo\` — 编译配置
          - \`profiles.json\` — 目标架构
          - \`manifest\` — 包列表

          ### 🔑 首次使用
          1. PVE 导入磁盘（见 README）
          2. 启动后访问 IP 进入设置向导
          3. 配置静态 IP + 管理员密码
          RELEASEEOF

      - name: 🚀 发布 Release
        uses: softprops/action-gh-release@v3
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ needs.check-upstream.outputs.owrt_ver_safe }}-n${{ needs.build.outputs.nikki_short_sha }}
          name: 🏝️ Oasisic OpenWrt ${{ needs.check-upstream.outputs.owrt_ver_safe }} (nikki-${{ needs.build.outputs.nikki_short_sha }})
          fail_on_unmatched_files: false
          make_latest: true
          generate_release_notes: false
          body_path: release-body.md
          files: |
            release-artifacts/bin/targets/x86/64/sha256sums
            release-artifacts/bin/targets/x86/64/sha256sums.minisig
            release-artifacts/feeds.conf.default
            release-artifacts/bin/targets/x86/64/openwrt-x86-64-generic-squashfs-combined-efi.img.gz
            release-artifacts/bin/targets/x86/64/openwrt-x86-64-generic-squashfs-combined.img.gz
            release-artifacts/bin/targets/x86/64/openwrt-x86-64-generic-image.iso
            release-artifacts/bin/targets/x86/64/openwrt-x86-64-generic-image-efi.iso
            release-artifacts/bin/targets/x86/64/config.buildinfo
            release-artifacts/bin/targets/x86/64/profiles.json
            release-artifacts/bin/targets/x86/64/openwrt-x86-64-generic.manifest

      - name: 📢 Discord 通知（🖥️・固件发布）
        if: success()
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          OWRT_VER: ${{ needs.check-upstream.outputs.owrt_version }}
          NIKKI_VER: ${{ needs.build.outputs.nikki_version_actual }}
          KERNEL_VER: ${{ needs.build.outputs.kernel_version }}
          ROOT_PASS: ${{ needs.build.outputs.root_password }}
          TAG: ${{ needs.check-upstream.outputs.owrt_ver_safe }}-n${{ needs.build.outputs.nikki_short_sha }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ needs.check-upstream.outputs.owrt_ver_safe }}-n${{ needs.build.outputs.nikki_short_sha }}
          BUILD_TIME: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
        run: python3 scripts/notify-discord.py
        continue-on-error: true

      - name: 🧹 清理临时文件
        if: always()
        run: |
          rm -f release-body.md
          rm -rf release-artifacts

  # ─── Job 4.5: PR 验证件发 prerelease（仅 PR 全量构建） ─────────────────
  # 目的：PR 里编出来的固件可以直接下载刷机测试，又不混进正式 Release
  ci-prerelease:
    needs: [check-upstream, build, qemu-smoke-test]
    if: github.event_name == 'pull_request' && needs.check-upstream.outputs.should_build == 'true'
    runs-on: ${{ inputs.runner_image || vars.RUNNER_IMAGE || 'ubuntu-26.04' }}
    steps:
      - uses: actions/checkout@v7

      - name: 📥 下载固件 Artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.check-upstream.outputs.artifact_name }}
          path: pr-artifacts/

      - name: 🏷️ 计算 prerelease tag
        id: tag
        run: |
          TAG="ci-${{ needs.check-upstream.outputs.owrt_ver_safe }}-pr${{ github.event.pull_request.number }}-r${{ github.run_number }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "### 🧪 PR 验证件" >> "$GITHUB_STEP_SUMMARY"
          echo "- tag：\`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 直链：${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: 🚀 发布 prerelease（不覆盖 latest）
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: 🧪 PR 验证件 ${{ needs.check-upstream.outputs.owrt_ver_safe }} (PR #${{ github.event.pull_request.number }})
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body: |
            ## 🧪 PR 验证件（非正式发布）

            | 项 | 值 |
            |----|-----|
            | OpenWrt | ${{ needs.check-upstream.outputs.owrt_version }} |
            | Nikki | ${{ needs.check-upstream.outputs.nikki_tag }}（${{ needs.check-upstream.outputs.nikki_short_sha }}） |
            | Runner | ${{ inputs.runner_image || vars.RUNNER_IMAGE || 'ubuntu-26.04' }} |
            | PR | #${{ github.event.pull_request.number }} |
            | 触发 | ${{ github.event.pull_request.html_url }} |

            仅供 PR 验证刷机测试，**不是正式版**；正式版走 main 的自动构建。
          files: |
            pr-artifacts/**/*.img.gz
            pr-artifacts/**/*.iso
            pr-artifacts/**/*.manifest
            pr-artifacts/**/sha256sums
            pr-artifacts/**/sha256sums.minisig
            pr-artifacts/**/config.buildinfo
            pr-artifacts/**/profiles.json
            pr-artifacts/**/feeds.conf.default

  # ─── Job 4.7: 失败通知（任何 job 红都发一张红卡） ──────────────────────
  notify-failure:
    needs: [lint, check-upstream, build, qemu-smoke-test, release, ci-prerelease, persist-last-build]
    if: failure()
    runs-on: ${{ inputs.runner_image || vars.RUNNER_IMAGE || 'ubuntu-26.04' }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: 📣 发送失败卡片（🖥️・固件发布）
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OWRT_VER: ${{ needs.check-upstream.outputs.owrt_version }}
          NIKKI_REF: ${{ needs.check-upstream.outputs.nikki_ref }}
          NIKKI_SHORT: ${{ needs.check-upstream.outputs.nikki_short_sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/notify-discord-failure.py
        continue-on-error: true

  # ─── Job 5: 回写 last_build_version（持久化） ──────────────────────────
  persist-last-build:
    needs: [check-upstream, build, qemu-smoke-test, release]
    if: needs.check-upstream.outputs.should_build == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ${{ inputs.runner_image || vars.RUNNER_IMAGE || 'ubuntu-26.04' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # 需要 push 权限，用 github.token
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🖊️ 回写 last_build_version
        run: |
          set -euo pipefail
          COMPOSITE="${{ needs.check-upstream.outputs.owrt_version }}_nikki-${{ needs.check-upstream.outputs.nikki_sha }}"
          FILE="${{ env.LAST_VERSION_FILE }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 构建可能很长；期间 main 若有新提交，直接 push 会被拒。先拉再写。
          git fetch origin main
          git checkout -B main origin/main

          if [ -f "$FILE" ] && [ "$(cat "$FILE")" = "$COMPOSITE" ]; then
            echo "⏭️  last_build_version 已是最新，跳过"
            exit 0
          fi

          echo "$COMPOSITE" > "$FILE"
          git add "$FILE"
          if git diff --cached --quiet; then
            echo "⏭️  last_build_version 无变化，跳过提交"
            exit 0
          fi

          git commit -m "chore: 更新 last_build_version [skip ci]

          Composite: $COMPOSITE"

          # 再试一次 rebase + push，避免提交瞬间竞态
          n=0
          until [ $n -ge 3 ]; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "✅ last_build_version 已回写至仓库"
              exit 0
            fi
            n=$((n+1))
            echo "⏳ push 冲突，第 $n 次重试..."
            sleep 3
          done
          echo "❌ last_build_version 回写失败（push 被拒）" >&2
          exit 1
